services:
  - type: web
    name: hekomi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAL_CLIENT_ID
        sync: false
      - key: MAL_CLIENT_SECRET
        sync: false
      - key: FOLIO_SESSION_SECRET
        generateValue: true
