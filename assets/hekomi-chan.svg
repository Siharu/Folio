<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Hekomi-chan</title>
  <desc id="desc">A playful pixel-art girl with long, slightly uneven midnight hair, lilac eyes, a violet shirt, dark trousers and one hand raised in a wave.</desc>
  <style>
    .float{animation:float 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .wave{transform-box:view-box;transform-origin:116px 111px;animation:wave 2.4s ease-in-out infinite}
    .blink{transform-box:fill-box;transform-origin:center;animation:blink 5.6s steps(1,end) infinite}
    .spark{animation:spark 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .spark.delay{animation-delay:-1.6s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes wave{0%,100%{transform:rotate(-3deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-1deg)}}
    @keyframes blink{0%,43%,47%,76%,80%,100%{transform:scaleY(1)}45%,78%{transform:scaleY(.12)}}
    @keyframes spark{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
    @media(prefers-reduced-motion:reduce){.float,.wave,.blink,.spark{animation:none!important}}
  </style>
  <ellipse cx="80" cy="190" rx="36" ry="5" fill="#11131d" opacity=".25"/>
  <g class="spark" fill="#b9a6ff"><rect x="18" y="73" width="4" height="4"/><rect x="14" y="77" width="4" height="4"/><rect x="22" y="77" width="4" height="4"/><rect x="18" y="81" width="4" height="4"/></g>
  <g class="spark delay" fill="#8be1cf"><rect x="136" y="112" width="4" height="4"/><rect x="132" y="116" width="4" height="4"/><rect x="140" y="116" width="4" height="4"/><rect x="136" y="120" width="4" height="4"/></g>
  <g class="float">
    <!-- Long back hair: deliberately uneven ends and chunky pixel highlights. -->
    <g fill="#171622">
      <rect x="44" y="28" width="72" height="27"/>
      <rect x="38" y="37" width="12" height="52"/>
      <rect x="34" y="57" width="10" height="47"/>
      <rect x="38" y="96" width="10" height="44"/>
      <rect x="44" y="127" width="10" height="34"/>
      <rect x="52" y="145" width="8" height="17"/>
      <rect x="108" y="39" width="14" height="56"/>
      <rect x="114" y="70" width="10" height="49"/>
      <rect x="110" y="109" width="10" height="39"/>
      <rect x="104" y="137" width="10" height="23"/>
    </g>
    <g fill="#30283f">
      <rect x="42" y="52" width="5" height="32"/><rect x="39" y="91" width="5" height="28"/>
      <rect x="48" y="135" width="5" height="18"/><rect x="113" y="51" width="5" height="33"/>
      <rect x="117" y="91" width="5" height="24"/><rect x="108" y="128" width="5" height="19"/>
    </g>
    <g fill="#514269">
      <rect x="48" y="31" width="10" height="4"/><rect x="58" y="27" width="12" height="4"/>
      <rect x="90" y="29" width="12" height="4"/><rect x="107" y="46" width="4" height="13"/>
      <rect x="39" y="69" width="4" height="10"/>
    </g>

    <!-- Legs and shoes, kept separate from the oversized tee. -->
    <g>
      <rect x="55" y="145" width="53" height="38" fill="#171a26"/>
      <rect x="57" y="149" width="22" height="31" fill="#333247"/>
      <rect x="82" y="149" width="22" height="31" fill="#29283a"/>
      <rect x="78" y="151" width="5" height="29" fill="#171a26"/>
      <rect x="58" y="154" width="5" height="20" fill="#514b66"/>
      <rect x="98" y="153" width="5" height="22" fill="#514b66"/>
      <rect x="53" y="178" width="29" height="10" fill="#242333"/>
      <rect x="83" y="178" width="27" height="10" fill="#242333"/>
      <rect x="50" y="185" width="33" height="5" fill="#171622"/>
      <rect x="82" y="185" width="31" height="5" fill="#171622"/>
      <rect x="59" y="181" width="15" height="3" fill="#8878a9"/>
      <rect x="88" y="181" width="14" height="3" fill="#8878a9"/>
    </g>

    <!-- Neck, collar and shirt silhouette. -->
    <g>
      <rect x="68" y="91" width="24" height="17" fill="#d99e91"/>
      <rect x="72" y="95" width="17" height="9" fill="#f0c3ad"/>
      <rect x="43" y="106" width="73" height="44" fill="#292338"/>
      <rect x="48" y="109" width="64" height="39" fill="#796995"/>
      <rect x="52" y="112" width="56" height="31" fill="#8a78aa"/>
      <rect x="47" y="112" width="8" height="17" fill="#685a85"/>
      <rect x="105" y="112" width="9" height="17" fill="#5c526f"/>
      <rect x="58" y="109" width="43" height="5" fill="#c5b5df"/>
      <rect x="71" y="108" width="18" height="5" fill="#8be1cf"/>
      <rect x="75" y="113" width="10" height="4" fill="#473d61"/>
      <rect x="86" y="123" width="5" height="5" fill="#b9a6ff"/>
      <rect x="91" y="128" width="5" height="5" fill="#b9a6ff"/>
      <rect x="86" y="133" width="5" height="5" fill="#b9a6ff"/>
      <rect x="81" y="128" width="5" height="5" fill="#b9a6ff"/>
      <rect x="56" y="144" width="50" height="4" fill="#514765"/>
    </g>

    <!-- Relaxed arm. -->
    <g>
      <rect x="36" y="108" width="17" height="18" fill="#292338"/>
      <rect x="39" y="111" width="13" height="12" fill="#8a78aa"/>
      <rect x="33" y="122" width="12" height="18" fill="#d99e91"/>
      <rect x="31" y="137" width="14" height="9" fill="#f0c3ad"/>
      <rect x="35" y="143" width="8" height="4" fill="#d99e91"/>
    </g>

    <!-- Face and ears. -->
    <g>
      <rect x="45" y="51" width="8" height="16" fill="#d99e91"/>
      <rect x="107" y="51" width="8" height="16" fill="#d99e91"/>
      <rect x="49" y="40" width="62" height="56" fill="#171622"/>
      <rect x="53" y="44" width="54" height="48" fill="#edbba8"/>
      <rect x="57" y="48" width="46" height="39" fill="#f3c9b7"/>
      <rect x="53" y="67" width="5" height="14" fill="#edbba8"/>
      <rect x="103" y="66" width="5" height="14" fill="#edbba8"/>
      <rect x="59" y="72" width="5" height="4" fill="#e99d9e"/>
      <rect x="99" y="72" width="5" height="4" fill="#e99d9e"/>
    </g>

    <!-- Main fringe; the uneven locks are part of her silhouette. -->
    <g fill="#211b2e">
      <rect x="42" y="31" width="76" height="20"/>
      <rect x="46" y="26" width="65" height="12"/>
      <rect x="39" y="39" width="13" height="25"/>
      <rect x="47" y="42" width="13" height="17"/>
      <rect x="59" y="39" width="13" height="22"/>
      <rect x="72" y="37" width="12" height="18"/>
      <rect x="82" y="39" width="13" height="17"/>
      <rect x="94" y="37" width="13" height="25"/>
      <rect x="106" y="40" width="10" height="18"/>
    </g>
    <g fill="#403451">
      <rect x="52" y="29" width="13" height="4"/><rect x="70" y="27" width="15" height="4"/>
      <rect x="93" y="29" width="11" height="4"/><rect x="43" y="47" width="5" height="12"/>
      <rect x="109" y="47" width="4" height="12"/>
    </g>
    <g fill="#625078">
      <rect x="59" y="31" width="9" height="3"/><rect x="87" y="30" width="8" height="3"/>
      <rect x="45" y="73" width="4" height="19"/><rect x="116" y="80" width="4" height="20"/>
    </g>

    <!-- Eyes, brows and her tiny mischievous smile. -->
    <g class="blink">
      <rect x="60" y="62" width="13" height="7" fill="#34283e"/>
      <rect x="63" y="63" width="7" height="6" fill="#8c6ac2"/>
      <rect x="65" y="63" width="3" height="4" fill="#e7d8ff"/>
      <rect x="90" y="63" width="13" height="3" fill="#34283e"/>
      <rect x="93" y="61" width="8" height="3" fill="#34283e"/>
    </g>
    <g fill="#34283e">
      <rect x="59" y="58" width="13" height="3"/><rect x="90" y="59" width="12" height="3"/>
      <rect x="77" y="78" width="12" height="3"/><rect x="85" y="81" width="5" height="3"/>
    </g>
    <g fill="#d98f95"><rect x="58" y="73" width="7" height="3"/><rect x="98" y="73" width="7" height="3"/></g>
    <rect x="100" y="47" width="5" height="5" fill="#8be1cf"/>
    <rect x="105" y="42" width="5" height="5" fill="#b9a6ff"/>
    <rect x="110" y="47" width="5" height="5" fill="#8be1cf"/>

    <!-- Raised waving arm, animated independently from her body. -->
    <g class="wave">
      <rect x="104" y="105" width="17" height="19" fill="#292338"/>
      <rect x="108" y="108" width="12" height="13" fill="#8a78aa"/>
      <rect x="116" y="91" width="12" height="22" fill="#d99e91"/>
      <rect x="120" y="78" width="12" height="19" fill="#f0c3ad"/>
      <rect x="119" y="64" width="17" height="18" fill="#f0c3ad"/>
      <rect x="120" y="57" width="5" height="12" fill="#edbba8"/>
      <rect x="127" y="51" width="5" height="18" fill="#f3c9b7"/>
      <rect x="134" y="56" width="5" height="14" fill="#edbba8"/>
      <rect x="116" y="66" width="5" height="9" fill="#d99e91"/>
      <rect x="124" y="72" width="11" height="5" fill="#edbba8"/>
      <rect x="123" y="94" width="5" height="9" fill="#c7837f"/>
    </g>
  </g>
</svg>